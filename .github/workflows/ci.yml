name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply schema
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -f schema.sql
      - name: Run tests
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -f tests/test_greetings.sql
      - name: Ensure SonarQube Cloud project exists
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          http_code=$(curl -s -o /tmp/sonar_create.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $SONAR_TOKEN" \
            "https://sonarqube.us/api/projects/create" \
            --data-urlencode "organization=gourabd1ms" \
            --data-urlencode "project=gourabd1ms_sql_demo" \
            --data-urlencode "name=sql.demo")
          echo "HTTP $http_code"
          cat /tmp/sonar_create.json
          if [ "$http_code" != "200" ] && [ "$http_code" != "201" ]; then
            if grep -qi "already exist" /tmp/sonar_create.json; then
              echo "Project already exists, continuing"
            else
              echo "Failed to create Sonar project"
              exit 1
            fi
          fi
      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarqube.us
